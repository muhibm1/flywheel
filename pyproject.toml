[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "langsmith-flywheel"
version = "0.1.0"
description = "Turn a LangGraph agent's LangSmith traces into regression tests, and gate every pull request on them."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Muhammad Muhibullah" }]
# The core needs nothing outside the standard library, so the offline gate runs anywhere.
dependencies = []

[project.optional-dependencies]
# Only the LangSmith backend imports it (src/flywheel/langsmith_backend.py).
langsmith = ["langsmith==0.14.2"]
dev = ["pytest==9.1.1", "ruff==0.16.9"]

[project.scripts]
flywheel = "flywheel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Test data: emails and questions are kept verbatim, one per line.
"studies/**/traffic_emails.py" = ["E501"]
"studies/**/questions.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
