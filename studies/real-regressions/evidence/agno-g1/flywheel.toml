[flywheel]
target = "adapter:target"
evaluators = ["adapter:check_no_error", "adapter:check_answer", "adapter:check_tools", "adapter:check_structured", "adapter:check_state", "adapter:check_files", "adapter:check_tool_args", "adapter:check_knowledge"]
dataset = "dataset.jsonl"
repetitions = 3

[gate]
max_broken = 0
close_call_repetitions = 3
min_new_error_runs = 2
