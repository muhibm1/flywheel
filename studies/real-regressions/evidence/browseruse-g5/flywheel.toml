[flywheel]
target = "adapter:target"
evaluators = ["adapter:check_completed", "adapter:check_answer", "adapter:check_structured", "adapter:check_tools", "adapter:check_requests", "adapter:check_notes", "adapter:check_files", "adapter:check_judge", "adapter:check_attachments"]
dataset = "dataset.jsonl"
repetitions = 3

[gate]
max_broken = 0
close_call_repetitions = 3
min_new_error_runs = 2
