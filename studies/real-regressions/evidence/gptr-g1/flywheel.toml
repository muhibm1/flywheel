[flywheel]
target = "adapter:target"
evaluators = ["adapter:check_completed", "adapter:check_facts", "adapter:check_no_forbidden", "adapter:check_sources", "adapter:check_search_results", "adapter:check_format"]
dataset = "dataset.jsonl"
repetitions = 3

[gate]
max_broken = 0
close_call_repetitions = 3
min_new_error_runs = 2
